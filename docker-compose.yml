services:
  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: rag-lab-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    networks:
      - raglab

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-lab-app
    ports:
      - "8501:8501"
    environment:
      QDRANT_URL: http://qdrant:6333
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-https://ollama.com}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      RERANKER_MODEL: ${RERANKER_MODEL:-Qwen/Qwen3-Reranker-0.6B}
      GENERATOR_MODEL: ${GENERATOR_MODEL:-gpt-oss:20b}
      STREAMLIT_SERVER_PORT: 8501
    volumes:
      - ./data:/app/data
      - ./experiments:/app/experiments
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    networks:
      - raglab
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  raglab:
    driver: bridge

volumes:
  qdrant_data:
