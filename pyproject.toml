[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-lab"
version = "0.1.0"
description = "Local-first evaluation-driven RAG workbench for synthetic e-commerce catalogs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "RAG Lab Contributors" }]
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pandas>=2.2",
  "streamlit>=1.36",
  "python-dotenv>=1.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]
retrieval = [
  "qdrant-client>=1.11",
  "rank-bm25>=0.2.2",
  "sentence-transformers>=3.0",
]
eval = [
  "ragas>=0.1.21",
]

[project.scripts]
rag-lab-generate-catalog = "src.data.synthetic_generator:main"
rag-lab-generate-benchmark = "src.data.benchmark_generator:main"
rag-lab-index = "src.ingestion.index_builder:main"
rag-lab-eval = "src.evaluation.run_benchmark:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
